<style>
:root{--lf:none;--bg:#f6f4f0;--card:#fff;--tx:#25221e;--mu:#7a746b;--bd:#e3ded6;--ac:#8a5a2b;--ok:#2e7d4f;--wa:#b26a00;--er:#b3261e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--lf:invert(1);--bg:#1b1916;--card:#262320;--tx:#efeae2;--mu:#a39b8f;--bd:#3a352f;--ac:#d9a066;--ok:#6cc08b;--wa:#e0a64a;--er:#f08a82}}
:root[data-theme="dark"]{--lf:invert(1);--bg:#1b1916;--card:#262320;--tx:#efeae2;--mu:#a39b8f;--bd:#3a352f;--ac:#d9a066;--ok:#6cc08b;--wa:#e0a64a;--er:#f08a82}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:12px 16px;font-weight:700;font-size:17px;border-bottom:1px solid var(--bd);background:var(--card)}
nav{display:flex;gap:4px;overflow-x:auto;padding:8px 12px;background:var(--card);border-bottom:1px solid var(--bd);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
nav button{border:0;background:none;color:var(--mu);padding:8px 12px;border-radius:8px;font:inherit;white-space:nowrap;cursor:pointer}
nav button.on{background:var(--ac);color:#fff}
main{max-width:1100px;margin:0 auto;padding:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:14px}
h2{font-size:16px;margin:0 0 10px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px}.k small{color:var(--mu);display:block}.k b{font-size:20px}
label{display:block;font-size:12px;color:var(--mu)}
input,select,textarea{width:100%;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.btn{border:0;background:var(--ac);color:#fff;padding:9px 14px;border-radius:8px;font:inherit;cursor:pointer}.btn.s{background:none;color:var(--ac);border:1px solid var(--ac);padding:4px 9px;font-size:13px}
.w{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}th{color:var(--mu);font-weight:600;font-size:12px}
.r{text-align:right}.neg{color:var(--er)}.pos{color:var(--ok)}.bar{height:8px;background:var(--ac);border-radius:4px;margin-top:3px}
.tag{padding:2px 8px;border-radius:10px;font-size:12px;border:1px solid currentColor}.Aberto{color:var(--wa)}.Fechado{color:var(--ac)}.Pago{color:var(--ok)}
.msg{color:var(--mu);padding:10px}
.logo{height:34px;width:auto;filter:var(--lf);vertical-align:middle}.logo.g2{height:90px;display:block;margin:0 auto 14px}

<script>
const D={lojas:[],produtos:[],mov:[],fech:[]};let tab='dash',ready=0;
const $=id=>document.getElementById(id),v=id=>$(id)?$(id).value:'';
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const dt=s=>s?s.split('-').reverse().join('/'):'';
const hoje=()=>new Date(Date.now()-new Date().getTimezoneOffset()*6e4).toISOString().slice(0,10);
const L=id=>D.lojas.find(x=>x.id==id)||{},P_=id=>D.produtos.find(x=>x.id==id)||{};
const r2=n=>Math.round(n*100)/100;
const isod=t=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec((t||'').trim());if(!m)return '';const d=new Date(+m[3],+m[2]-1,+m[1]);return d.getDate()==+m[1]&&d.getMonth()==+m[2]-1?`${m[3]}-${m[2]}-${m[1]}`:''};
const mk=e=>{const d=e.value.replace(/\D/g,'').slice(0,8);e.value=d.length>4?d.slice(0,2)+'/'+d.slice(2,4)+'/'+d.slice(4):d.length>2?d.slice(0,2)+'/'+d.slice(2):d};
const D8=(val,fn)=>`<input inputmode="numeric" maxlength="10" placeholder="dd/mm/aaaa" value="${dt(val)}" oninput="mk(this)" onchange="const X=isod(this.value);${fn}">`;
const cat=p=>(p&&p.cat)||'Sem categoria';
let P={i:hoje().slice(0,4)+'-01-01',f:hoje().slice(0,4)+'-12-31',l:''},E={},M={t:'entrada',d:hoje(),q:'',v:'',o:''},C={d:hoje(),s:'Aberto'},FL={},ML='',OPEN=null;
const lojaOpts=(sel,all)=>(ro?'':`<option value="">${all?'Todas':'Selecione'}</option>`)+D.lojas.filter(l=>ro||all||l.ativa!==false).map(l=>`<option value="${l.id}" ${l.id==sel?'selected':''}>${esc(l.nome)}</option>`).join('');
const prodOpts=sel=>`<option value="">Selecione</option>`+D.produtos.filter(p=>p.ativo!==false).map(p=>`<option value="${p.id}" ${p.id==sel?'selected':''}>${esc(p.sku)} · ${esc(p.nome)}</option>`).join('');
const stock=(l,p)=>D.mov.filter(m=>m.loja==l&&m.prod==p).reduce((a,m)=>a+m.qtd,0);
const vendas=(l,i,f)=>D.mov.filter(m=>m.tipo=='venda'&&(!l||m.loja==l)&&m.data>=i&&m.data<=f);
const val=m=>Math.abs(m.qtd)*m.preco;
const tipos={entrada:1,venda:-1,ajuste_pos:1,ajuste_neg:-1,devolucao:-1},tn={entrada:'Entrada',venda:'Venda',ajuste_pos:'Ajuste positivo',ajuste_neg:'Ajuste negativo',devolucao:'Devolução'};
const add=(c,o)=>db.collection(c).add({...o,ts:Date.now()}),upd=(c,id,o)=>db.doc(c+'/'+id).update(o);
const T=[['dash','Painel'],['est','Estoque'],['mov','Lançamentos'],['fech','Fechamentos'],['lojas','Lojas'],['prods','Produtos']];
const go=t=>{tab=t;OPEN=null;render()};
function table(h,rows,empty){return rows.length?`<div class="w"><table><tr>${h.map(x=>`<th class="${x[0]=='>'?'r':''}">${x.replace(/^>/,'')}</th>`).join('')}</tr>${rows.join('')}</table></div>`:`<div class="msg">${empty||'Nada por aqui ainda.'}</div>`}
function bars(o){const e=Object.entries(o).sort((a,b)=>b[1]-a[1]),mx=Math.max(1,...e.map(x=>x[1]));return e.length?e.map(([k,x])=>`<div style="margin:6px 0"><div style="display:flex;justify-content:space-between"><span>${esc(k)}</span><b>${brl(x)}</b></div><div class="bar" style="width:${x/mx*100}%"></div></div>`).join(''):'<div class="msg">Sem vendas no período.</div>'}
const filt=()=>`<div class="g" style="margin-bottom:12px"><div><label>Loja</label><select onchange="P.l=this.value;render()">${lojaOpts(P.l,1)}</select></div><div><label>De</label>${D8(P.i,"P.i=X||P.i;render()")}</div><div><label>Até</label>${D8(P.f,"P.f=X||P.f;render()")}</div></div>`;

function chart(vs){
 if(!P.i||!P.f||P.i>P.f)return '';const mm={};let y=+P.i.slice(0,4),m=+P.i.slice(5,7);const ye=+P.f.slice(0,4),me=+P.f.slice(5,7);
 while(y<ye||(y==ye&&m<=me)){mm[`${y}-${String(m).padStart(2,'0')}`]=0;if(++m>12){m=1;y++}}
 vs.forEach(x=>{const k=x.data.slice(0,7);if(k in mm)mm[k]+=val(x)});
 const e=Object.entries(mm),mx=Math.max(1,...e.map(x=>x[1]));
 return `<div class="card"><h2>Evolução das vendas</h2><div class="w"><div style="display:flex;align-items:flex-end;gap:6px;height:190px;min-width:${e.length*44}px;padding-top:6px">${e.map(([k,x])=>`<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%" title="${k.slice(5)}/${k.slice(0,4)}: ${brl(x)}"><small style="font-size:11px;color:var(--mu)">${x?Math.round(x).toLocaleString('pt-BR'):''}</small><div style="width:100%;max-width:38px;border-radius:5px 5px 0 0;background:var(--ac);height:${x/mx*140}px;min-height:${x?3:1}px;opacity:${x?1:.25}"></div><small style="font-size:11px;margin-top:4px">${k.slice(5)}/${k.slice(2,4)}</small></div>`).join('')}</div></div><p class="msg" style="padding:6px 0 0">Valores em R$, por mês.</p></div>`}
function dash(){
 const vs=vendas(P.l,P.i,P.f);let tot=0,com=0,bl={},bp={};
 vs.forEach(m=>{const x=val(m),c=x*(L(m.loja).comissao||0)/100;tot+=x;com+=c;bl[L(m.loja).nome||'?']=(bl[L(m.loja).nome||'?']||0)+x;bp[P_(m.prod).nome||'?']=(bp[P_(m.prod).nome||'?']||0)+x});
 let es=0,np=0;D.lojas.filter(l=>!P.l||l.id==P.l).forEach(l=>D.produtos.forEach(p=>{const s=stock(l.id,p.id);if(s>0){es+=s;np++}}));
 const k=(a,b)=>`<div class="k"><small>${a}</small><b>${b}</b></div>`;
 const rec=r2(D.fech.filter(f=>(!P.l||f.loja==P.l)&&f.status=='Pago'&&f.fim>=P.i&&f.ini<=P.f).reduce((a,f)=>a+f.dev,0));
 const kp=ro?k('Total vendido',brl(tot))+k('Comissões',brl(com))+k('Produtos em estoque',np)+k('Estoque total',es+' un.')
  :k('Total vendido',brl(tot))+k('Comissões',brl(com))+k('Recebido / Total a repassar',`${brl(rec)} <span style="font-size:13px;color:var(--mu)">de ${brl(tot-com)}</span>`)+k('Lojas',D.lojas.filter(l=>l.ativa!==false).length)+k('Produtos em estoque',np)+k('Estoque total',es+' un.');
 return filt()+`<div class="g" style="margin-bottom:14px">${kp}</div>`+chart(vs)+`<div class="g">${ro?'':`<div class="card"><h2>Vendas por loja</h2>${bars(bl)}</div>`}<div class="card"><h2>Vendas por produto</h2>${bars(bp)}</div></div>`}

function estResumo(){
 const ls=D.lojas.filter(l=>!P.l||l.id==P.l).map(l=>l.id),ms=D.mov.filter(m=>ls.includes(m.loja));
 const c={};let at=0,vl=0,uv=0,tv=0;
 ms.forEach(m=>{const p=P_(m.prod),k=cat(p);c[k]=c[k]||{at:0,ven:0,vl:0};c[k].at+=m.qtd;c[k].vl+=m.qtd*(p.preco||0);at+=m.qtd;vl+=m.qtd*(p.preco||0);if(m.tipo=='venda'){c[k].ven+=-m.qtd;uv+=-m.qtd;tv+=val(m)}});
 const k=(a,b,x)=>`<div class="k"><small>${a}</small><b>${b}</b>${x?`<small>${x}</small>`:''}</div>`;
 return `<div class="g" style="margin-bottom:14px">${k('Total vendido (geral)',brl(tv),uv+' un. vendidas')}${k('Estoque atual na loja',at+' un.','valor '+brl(vl))}</div>
 <div class="card"><h2>Estoque total na loja, por categoria</h2><div class="g">${Object.entries(c).sort().map(([n,x])=>k(esc(n),x.at+' un.','vendido: '+x.ven+' un.')).join('')||'<div class="msg">Sem movimentações.</div>'}</div></div>`}
function extEst(){
 const logo=(document.querySelector('header img')||{}).src||'',ls=D.lojas.filter(l=>!P.l||l.id==P.l);
 const sec=l=>{const g={},T=[0,0,0];
  D.produtos.forEach(p=>{const ms=D.mov.filter(m=>m.loja==l.id&&m.prod==p.id);if(!ms.length)return;(g[cat(p)]=g[cat(p)]||[]).push({p,r:ms.filter(m=>m.qtd>0).reduce((a,m)=>a+m.qtd,0),v:-ms.filter(m=>m.tipo=='venda').reduce((a,m)=>a+m.qtd,0),a:stock(l.id,p.id)})});
  const body=Object.entries(g).sort().map(([c,a])=>{a.sort((x,y)=>(x.p.nome||'').localeCompare(y.p.nome||''));const s=[0,0,0];a.forEach(x=>{s[0]+=x.r;s[1]+=x.v;s[2]+=x.a});s.forEach((n,i)=>T[i]+=n);

function prods(){
 const e=E.p||{preco:'',custo:''};
 const rows=D.produtos.map(p=>`<tr><td>${esc(p.sku)}</td><td>${esc(p.nome)}</td><td>${esc(p.cat)}</td><td class="r">${brl(p.preco)}</td><td class="r">${brl(p.custo)}</td><td>${p.ativo!==false?'Ativo':'Inativo'}</td><td><button class="btn s" onclick="E.p=D.produtos.find(x=>x.id=='${p.id}');render()">Editar</button></td></tr>`);
 return `<div class="card"><h2>${e.id?'Editar':'Novo'} produto</h2><div class="g">
 <div><label>SKU</label><input id="ps" value="${esc(e.sku)}"></div><div><label>Produto</label><input id="pn" value="${esc(e.nome)}"></div>
 <div><label>Categoria</label><input id="pc" value="${esc(e.cat)}"></div><div><label>Preço de venda</label><input id="pp" type="number" step="0.01" value="${e.preco}"></div>
 <div><label>Custo</label><input id="pu" type="number" step="0.01" value="${e.custo}"></div>
 <div><label>Status</label><select id="pa"><option value="1">Ativo</option><option value="0" ${e.ativo===false?'selected':''}>Inativo</option></select></div></div>
 <p><button class="btn" onclick="saveP()">Salvar</button> ${e.id?'<button class="btn s" onclick="E.p=null;render()">Cancelar</button>':''}</p></div><div class="card"><h2>Produtos</h2>`+table(['SKU','Produto','Categoria','>Preço','>Custo','Status',''],rows)+`</div>`}
async function saveP(){
 if(!v('ps').trim()||!v('pn').trim())return alert('Informe SKU e nome.');
 const o={sku:v('ps').trim(),nome:v('pn').trim(),cat:v('pc'),preco:+v('pp')||0,custo:+v('pu')||0,ativo:v('pa')=='1'};
 E.p&&E.p.id?await upd('produtos',E.p.id,o):await add('produtos',o);E.p=null;render()}

function render(){
 if(!ready)return;
 if(ro&&D.lojas.length){P.l=D.lojas[0].id;FL.l=D.lojas[0].id;M.l=M.l||D.lojas[0].id;ML=D.lojas[0].id;C.l=C.l||D.lojas[0].id;C.i=C.i||hoje().slice(0,8)+'01';C.f=C.f||hoje()}
 $('nav').innerHTML=T.filter(t=>!ro||!['lojas','prods'].includes(t[0])).map(t=>`<button class="${t[0]==tab?'on':''}" onclick="go('${t[0]}')">${t[1]}</button>`).join('');
 const sy=scrollY;$('app').innerHTML={dash,est,mov,fech,lojas,prods}[tab]();if(ro)hideAdm();scrollTo(0,sy)}

async function load(c){
 const {data,error}=await sb.from(c).select('*');if(error)throw error;
 const rows=data.map(r=>({id:r.id,...r.data,ts:r.ts}));
 if(c=='produtos'&&papel=='admin'){const {data:cs}=await sb.from('produtos_custo').select('*'),m={};(cs||[]).forEach(x=>m[x.id]=x.custo);rows.forEach(r=>r.custo=m[r.id]??0)}
 return rows}
async function refresh(c){try{D[c]=await load(c);render()}catch(e){$('app').innerHTML='<div class="card msg">Erro no banco: '+esc(e.message)+'</div>'}}
const split=(c,o)=>{const d={...o};delete d.id;delete d.ts;let custo;if(c=='produtos'&&'custo' in d){custo=d.custo;delete d.custo}return [d,custo]};
const fail=e=>{alert('Não foi possível salvar: '+e.message);throw e};
const db={
 collection:c=>({add:async o=>{const [d,custo]=split(c,o);
  const {data,error}=await sb.from(c).insert({data:d,loja_id:c=='lojas'||c=='produtos'?undefined:d.loja,ts:o.ts}).select().single();if(error)fail(error);
  if(custo!==undefined){const r=await sb.from('produtos_custo').insert({id:data.id,custo});if(r.error)fail(r.error)}
  await refresh(c)}}),
 doc:p=>({update:async o=>{const [c,id]=p.split('/'),[d,custo]=split(c,o),{id:_i,ts:_t,custo:_c,...old}=D[c].find(x=>x.id==id)||{};
  const {error}=await sb.from(c).update({data:{...old,...d}}).eq('id',id);if(error)fail(error);
  if(custo!==undefined){const r=await sb.from('produtos_custo').upsert({id,custo});if(r.error)fail(r.error)}
  await refresh(c)}})};

async function entrar(){const {error}=await sb.auth.signInWithPassword({email:v('em').trim(),password:v('pw')});if(error)return alert('E-mail ou senha inválidos.');init()}
let REC=/type=recovery/.test(location.hash);
function novaSenha(){$('nav').innerHTML='';$('app').innerHTML='<div class="card" style="max-width:340px;margin:30px auto"><h2>Definir nova senha</h2><label>Nova senha</label><input id="n1" type="password"><label style="margin-top:8px">Repita a senha</label><input id="n2" type="password"><p><button class="btn" onclick="salvarSenha()">Salvar senha</button></p></div>'}
async function salvarSenha(){const a=v('n1'),b=v('n2');if(a.length<8)return alert('A senha precisa ter pelo menos 8 caracteres.');if(a!=b)return alert('As senhas não conferem.');const {error}=await sb.auth.updateUser({password:a});if(error)return alert('Não foi possível salvar: '+error.message);alert('Senha alterada com sucesso.');REC=false;history.replaceState(null,'',location.pathname);init()}
async function sair(){await sb.auth.signOut();location.reload()}
async function init(){
 if(SUPA_URL.startsWith('COLE')){$('app').innerHTML='<div class="card msg">Preencha SUPA_URL e SUPA_KEY no início do script (veja o LEIA-ME).</div>';return}
 if(/error_code=/.test(location.hash)){alert('Link inválido ou expirado. Peça um novo.');history.replaceState(null,'',location.pathname)}
 const {data:{session}}=await sb.auth.getSession();if(!session)return login();
 if(REC)return novaSenha();
 const {data:pf}=await sb.from('perfis').select('*').eq('user_id',session.user.id).maybeSingle();
 if(!pf){$('app').innerHTML='<div class="card msg">Seu usuário ainda não foi liberado. Fale com o administrador.</div>';return}
 papel=pf.papel;ro=papel!='admin';ready=1;
 ['lojas','produtos','mov','fech'].forEach(refresh);
 setInterval(()=>['lojas','produtos','mov','fech'].forEach(refresh),30000)}
window.addEventListener('load',init);
</script></body></html>
